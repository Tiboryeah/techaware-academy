[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

# Evita que Netlify inyecte snippets en archivos XML y TXT
[build.processing]
  skip_processing = false

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# SPA fallback — Netlify sirve archivos estáticos primero, luego aplica esto
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
