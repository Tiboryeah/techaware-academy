[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

# Seguridad HTTP — aplicado a todas las rutas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://techaware-academy.onrender.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: blob: https:; font-src 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# SPA fallback — Netlify sirve archivos estáticos primero, luego aplica esto
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
